    function startClock() {

        const d = new Date();
        el.innerText = `현재시각: ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;

      update();
      setInterval(update, 1000);
    }

    function saveSession() {
      localStorage.setItem(`${STORAGE_KEY}_${currentSessionId}`, JSON.stringify({ stops, departureTime }));
    }

    function loadStoredSession() {
      const saved = localStorage.getItem(`${STORAGE_KEY}_${currentSessionId}`);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          stops = parsed.stops || [];
          departureTime = parsed.departureTime || "08:30";
          triggerRoadRoutingAndRecalc();
          return;
        } catch (e) {

        }

      switchSession("nohyeong18");

      stops.forEach(s => {
        s.completed = false;
        s.completedAt = null;
      });
      triggerRoadRoutingAndRecalc();
    }

    // ----------------------------------------------------
    // 3. OSRM 실제 도로망 라우팅 엔진 연동
    // ----------------------------------------------------
    async function triggerRoadRoutingAndRecalc() {
      const statusBox = document.getElementById('routing-status');
      statusBox.classList.remove('hidden');

      let roadDistanceKm = 0;
      let routeGeoJSON = null;

      if (stops.length >= 2) {
        // OSRM 엔드포인트 좌표 포맷: lon,lat;lon,lat;...
        const coordParam = stops.map(s => `${s.lng},${s.lat}`).join(';');
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordParam}?overview=full&geometries=geojson`;

        try {
          const res = await fetch(osrmUrl);
          const data = await res.json();

          if (data && data.routes && data.routes.length > 0) {
            const bestRoute = data.routes[0];
            roadDistanceKm = (bestRoute.distance / 1000).toFixed(1);
            routeGeoJSON = bestRoute.geometry;

            // 각 레그(구간)별 실제 도로 거리 및 시간 배분
            if (bestRoute.legs && bestRoute.legs.length === stops.length - 1) {
              bestRoute.legs.forEach((leg, idx) => {
                const targetStop = stops[idx + 1];
                targetStop.realLegKm = (leg.distance / 1000).toFixed(2);
                targetStop.rawDriveSec = leg.duration;
              });
            }
          }
        } catch (err) {
          console.warn("OSRM 도로망 호출 실패, 내부 보정 엔진 대체:", err);
        }
      }

      statusBox.classList.add('hidden');
      recalculateSchedule(roadDistanceKm);
      renderMapRoute(routeGeoJSON);
      renderCards();
    }

    // ----------------------------------------------------
    // 4. 물리 보정 계수 및 실시간 리스케줄링 계산
    // ----------------------------------------------------
    function recalculateSchedule(totalRoadKm) {
      if (!stops || stops.length === 0) return;

      let currentTime = parseHHMM(departureTime);
      let accumulatedKm = 0;

      stops.forEach((stop, idx) => {
        // 하차 작업 소요 시간 세분화 모델 (T_unload)
        stop.unloadMin = computeUnloadTime(stop);

        // 주행 시간 계산 (T_drive = 기본시간 * K_road * K_cargo)
        if (idx === 0) {
          stop.driveMin = 6;
          stop.stepKm = 1.2;
        } else {
          let baseMin = 5;
          let legKm = 1.0;

          if (stop.rawDriveSec) {
            baseMin = Math.round(stop.rawDriveSec / 60);
            legKm = parseFloat(stop.realLegKm) || 1.0;
          } else {
            const prev = stops[idx - 1];
            legKm = getCrowDist(prev.lat, prev.lng, stop.lat, stop.lng);
            baseMin = Math.max(3, Math.round((legKm / 32) * 60));
          }

          stop.stepKm = legKm;
          accumulatedKm += legKm;

          // 도로 환경 계수 (K_road)
          let kRoad = 1.0;
          if (stop.address.includes("516로") || stop.address.includes("산록남로") || stop.address.includes("고사마루길")) {
            kRoad = 1.25;
          } else if (stop.address.includes("월랑로") || stop.address.includes("다랑곶")) {
            kRoad = 1.15; // 좁은 골목
          }

          // 화물 특성 계수 (K_cargo: 신선식품/한우/과일 감속)
          let kCargo = (stop.goods.includes("한우") || stop.goods.includes("과일") || stop.goods.includes("사과")) ? 1.15 : 1.0;

          stop.driveMin = Math.max(3, Math.round(baseMin * kRoad * kCargo));
        }

        // 실시간 연쇄 시간 업데이트 (하차완료 시각 박제)
        if (stop.completed && stop.completedAt) {
          currentTime = parseHHMM(stop.completedAt);
          stop.etaArrival = stop.completedAt;
          stop.etaFinish = stop.completedAt;
        } else {
          const arrD = new Date(currentTime.getTime() + stop.driveMin * 60000);
          const finD = new Date(arrD.getTime() + stop.unloadMin * 60000);

          stop.etaArrival = formatHHMM(arrD);
          stop.etaFinish = formatHHMM(finD);
          currentTime = finD;
        }
      });

      // 대시보드 업데이트
      const totalBoxes = stops.reduce((sum, s) => sum + s.quantity, 0);
      const doneBoxes = stops.filter(s => s.completed).reduce((sum, s) => sum + s.quantity, 0);
      document.getElementById('stat-count').innerText = `${doneBoxes} / ${totalBoxes}`;
      
      const finalKm = totalRoadKm > 0 ? totalRoadKm : accumulatedKm.toFixed(1);
      document.getElementById('stat-total-dist').innerText = `${finalKm} km`;

      const nextTarget = stops.find(s => !s.completed);
      document.getElementById('stat-next-eta').innerText = nextTarget ? nextTarget.etaArrival : "완판";

      const lastStop = stops[stops.length - 1];
      document.getElementById('stat-finish-eta').innerText = lastStop ? lastStop.etaFinish : "--:--";

      saveSession();
    }

    function computeUnloadTime(item) {
      if (item.quantity >= 180) return 21; // 초대량 경량 마당
      if (item.quantity >= 100) return 34; // 리조트 카트 왕복
      if (item.quantity <= 2) {
        if (item.building && (item.building.includes("호") || item.building.includes("층") || item.building.includes("아파트"))) {
          return 8; // 아파트/E/V 경유
        }
        return 6; // 소량 쾌속 매장앞
      }
      return 14;
    }

    function getCrowDist(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))) * 1.25; // 굴곡률 보정
    }

    function parseHHMM(str) {
      const [h, m] = str.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }

    function formatHHMM(d) {
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ----------------------------------------------------
    // 5. 카드 렌더링 및 텍스트 복사 로직 (핵심 요청 반영)
    // ----------------------------------------------------
    function renderCards() {
      const container = document.getElementById('card-list-container');
      container.innerHTML = "";

      stops.forEach((stop, index) => {
        const isDone = stop.completed;
        const boxBadge = stop.boxNos.join(", ");

        // [요청 반영 1] 타이틀 복사: 순번 + 이름 + 상세정보(아파트, 빌라, 층수) 자동 결합
        const titleCopyText = generateTitleWithDetail(stop, boxBadge);

        // [요청 반영 2] 내비 주소 복사: 동/호수/층수를 완벽 제거한 순수 도로명 주소
        const sanitizedRoadAddr = sanitizeAddressForNavi(stop.address);

        const card = document.createElement('div');
        card.className = `p-4 rounded-3xl border transition-all ${
          isDone 
            ? 'bg-slate-900/40 border-emerald-950/80 text-slate-500' 
            : 'bg-slate-900 border-slate-800 text-slate-100 shadow-xl'
        }`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2.5">
            <div class="flex items-center gap-3">
              <!-- 동글동글 박스 번호 배지 -->
              <div class="flex flex-col items-center">
                <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">BOX</span>
                <span class="px-2.5 py-1 rounded-2xl flex items-center justify-center text-sm font-black border ${
                  isDone 
                    ? 'bg-emerald-950 border-emerald-800 text-emerald-300' 
                    : 'bg-sky-500 text-slate-950 border-sky-400 shadow-md shadow-sky-500/20'
                }">
                  #${boxBadge}
                </span>
              </div>

              <div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-xs font-black text-slate-400 font-mono">[순번 ${index + 1}]</span>
                  <h3 class="font-extrabold text-base text-white flex items-center gap-1">
                    ${stop.name}
                  </h3>
                  ${stop.payAmount > 0 ? `<span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/50 px-2 py-0.5 rounded-full font-bold">착불 ${stop.payAmount.toLocaleString()}원</span>` : ''}
                </div>
                <p class="text-xs text-slate-400 font-mono mt-0.5">
                  ${stop.goods} · ${stop.quantity}박스
                </p>
              </div>
            </div>

            <!-- 순서 조정 원형 버튼 -->
            ${!isDone ? `
              <div class="flex items-center gap-1">
                <button onclick="moveStop(${index}, -1)" class="touch-pill w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs">▲</button>
                <button onclick="moveStop(${index}, 1)" class="touch-pill w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs">▼</button>
              </div>
            ` : ''}
          </div>

          <!-- 도로명 및 도착시간 알약 뷰 -->
          <div class="bg-slate-950/80 rounded-2xl p-2.5 mb-2.5 flex justify-between items-center text-xs border border-slate-800/80">
            <div class="flex items-center gap-1.5 text-slate-300 truncate pr-2">
              <i class="fa-solid fa-location-dot text-sky-400 text-xs"></i>
              <span class="font-bold text-white">${stop.address}</span>
              <span class="text-sky-300/90 text-[11px] font-semibold">${stop.building || ''}</span>
            </div>
            <div class="text-right whitespace-nowrap">
              <span class="text-slate-400 text-[10px]">도착:</span>
              <span class="font-black ${isDone ? 'text-slate-500' : 'text-emerald-400'}">${stop.etaArrival}</span>
            </div>
          </div>

          ${stop.notes ? `<div class="text-[11px] text-amber-300/80 mb-3 px-1 font-sans">※ ${stop.notes}</div>` : ''}

          <!-- 원터치 알약형 버튼 4열 그리드 -->
          <div class="grid grid-cols-4 gap-2">
            <!-- 타이틀 복사: 아파트/빌라/층수 자동 포함 -->
            <button onclick="copyToClip('${titleCopyText}', '타이틀+상세정보 복사완료')" class="touch-pill bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-full text-xs font-bold text-center truncate border border-slate-700/60 shadow-sm">
              <i class="fa-regular fa-copy mr-1 text-slate-400"></i>타이틀
            </button>
            <!-- 내비 복사: 정제 도로명 주소만 복사 -->
            <button onclick="copyToClip('${sanitizedRoadAddr}', '정제 도로명 복사완료 (카카오내비용)')" class="touch-pill bg-sky-950 hover:bg-sky-900 border border-sky-800 text-sky-300 py-2.5 rounded-full text-xs font-black text-center truncate shadow-sm">
              <i class="fa-solid fa-diamond-turn-right mr-1 text-sky-400"></i>내비복사
            </button>
            <a href="tel:${stop.phone}" class="touch-pill bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-full text-xs font-bold flex items-center justify-center border border-slate-700/60 shadow-sm">
              <i class="fa-solid fa-phone text-emerald-400 mr-1"></i>통화
            </a>
            <button onclick="toggleDone(${index})" class="touch-pill ${
              isDone 
                ? 'bg-emerald-950 border border-emerald-800 text-emerald-300' 
                : 'bg-emerald-600 hover:bg-emerald-500 text-white font-black shadow-lg shadow-emerald-700/30'
            } py-2.5 rounded-full text-xs text-center">
              ${isDone ? `<i class="fa-solid fa-check mr-1"></i>${stop.completedAt}` : '하차완료'}
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // 타이틀 복사 텍스트 빌더 (아파트, 빌라, 층수 결합)
    function generateTitleWithDetail(stop, boxBadge) {
      let text = `${boxBadge}번 ${stop.name}`;
      if (stop.building && stop.building.trim().length > 0) {
        text += ` ${stop.building.trim()}`;
      }
      return text;
    }

    // 카카오내비 호환용 주소 정제 (호수, 층수, 대괄호 제거)
    function sanitizeAddressForNavi(addr) {
      if (!addr) return "";
      return addr
        .replace(/\[\vert{}\]/g, '')
        .replace(/(\d+동\s*\d+호|\d+호|\d+층)/g, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function toggleDone(index) {
      const stop = stops[index];
      if (stop.completed) {
        stop.completed = false;
        stop.completedAt = null;
      } else {
        const d = new Date();
        stop.completed = true;
        stop.completedAt = formatHHMM(d);
      }
      triggerRoadRoutingAndRecalc();
    }

    function moveStop(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= stops.length) return;
      if (stops[index].completed || stops[target].completed) return;

      const tmp = stops[index];
      stops[index] = stops[target];
      stops[target] = tmp;

      triggerRoadRoutingAndRecalc();
    }

    function sortByRecommendedCourse() {
      if (currentSessionId === "nohyeong18") {
        const priorityOrder = ["s_6", "s_16", "s_1_9", "s_3", "s_11", "s_7_10", "s_4", "s_5", "s_13", "s_15", "s_8", "s_17", "s_18", "s_14", "s_2", "s_12"];
        stops.sort((a, b) => priorityOrder.indexOf(a.id) - priorityOrder.indexOf(b.id));
      } else {
        stops.sort((a, b) => b.quantity - a.quantity);
      }

      document.getElementById('btn-sort-course').className = "touch-pill px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px] font-bold";
      document.getElementById('btn-sort-box').className = "touch-pill px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 text-[11px] font-medium";

      triggerRoadRoutingAndRecalc();
    }

    function sortByBoxAsc() {
      stops.sort((a, b) => a.boxNos[0] - b.boxNos[0]);

      document.getElementById('btn-sort-box').className = "touch-pill px-3 py-1 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/40 text-[11px] font-bold";
      document.getElementById('btn-sort-course').className = "touch-pill px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 text-[11px] font-medium";

      triggerRoadRoutingAndRecalc();
    }

    function copyToClip(text, toastMsg) {
      navigator.clipboard.writeText(text).then(() => showToast(toastMsg));
    }

    function showToast(msg) {
      const t = document.createElement("div");
      t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900/95 border border-sky-400 text-sky-300 text-xs px-5 py-2.5 rounded-full shadow-2xl transition-all duration-200";
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => {
        t.style.opacity = "0";
        setTimeout(() => t.remove(), 250);
      }, 1300);
    }

    // ----------------------------------------------------
    // 6. Leaflet 실제 도로망 렌더링
    // ----------------------------------------------------
    function initMap() {
      leafletMap = L.map('map', { zoomControl: false }).setView([33.4830, 126.4800], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap'
      }).addTo(leafletMap);
    }

    function toggleMapHeight() {
      const el = document.getElementById('map');
      el.style.height = el.style.height === '420px' ? '250px' : '420px';
      setTimeout(() => leafletMap.invalidateSize(), 200);
    }

    function renderMapRoute(geoJsonData) {
      if (!leafletMap) return;

      markers.forEach(m => leafletMap.removeLayer(m));
      markers = [];
      if (roadPolylineLayer) leafletMap.removeLayer(roadPolylineLayer);

      const boundsCoords = [];

      // 둥근 핀 마커 렌더링
      stops.forEach((stop, idx) => {
        const coord = [stop.lat, stop.lng];
        boundsCoords.push(coord);

        const badgeText = stop.boxNos.join('/');
        const pinColor = stop.completed ? '#10b981' : (stop.payAmount > 0 ? '#f59e0b' : '#0284c7');

        const pinIcon = L.divIcon({
          className: 'custom-round-pin',
          html: `<div style="background-color: ${pinColor}; color: white; width: 28px; height: 28px; border-radius: 9999px; border: 2.5px solid white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.4);">${stop.completed ? '✓' : badgeText}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const marker = L.marker(coord, { icon: pinIcon }).addTo(leafletMap);
        marker.bindPopup(`<b>#${badgeText} ${stop.name}</b><br>${stop.address} ${stop.building || ''}<br>도착예정: ${stop.etaArrival}`);
        markers.push(marker);
      });

      // 실제 도로 궤적(GeoJSON) 렌더링
      if (geoJsonData && geoJsonData.coordinates) {
        roadPolylineLayer = L.geoJSON(geoJsonData, {
          style: {
            color: '#38bdf8',
            weight: 4.5,
            opacity: 0.85,
            lineJoin: 'round',
            lineCap: 'round'
          }
        }).addTo(leafletMap);
        leafletMap.fitBounds(roadPolylineLayer.getBounds(), { padding: [35, 35] });
      } else if (boundsCoords.length > 1) {
        // Fallback 직선
        roadPolylineLayer = L.polyline(boundsCoords, {
          color: '#38bdf8',
          weight: 3.5,
          dashArray: '5, 8',
          opacity: 0.75
        }).addTo(leafletMap);
        leafletMap.fitBounds(roadPolylineLayer.getBounds(), { padding: [35, 35] });
      }
    }
  </script>
</body>
