      recalculatePhysics();
      renderCardList();
      renderMapVisuals();

    // ------------------------------------------------------------------
    // 도로 및 하차 소요 시간 계산 엔진
    // ------------------------------------------------------------------
    function recalculatePhysics() {
      if (!stops || stops.length === 0) {
        refreshDashboard();
        return;
      }

      let pivotTime = parseHHMM(departureTime);

      stops.forEach((stop, idx) => {
        // 하차 기본 시간 산정 모델 (소량 쾌속: 6분, 합포/상가/E/V: 8~10분)
        if (stop.quantity >= 2) {
          stop.unloadMinutes = 9;
        } else if (stop.detail && (stop.detail.includes("층") || stop.detail.includes("호"))) {
          stop.unloadMinutes = 8;
        } else {
          stop.unloadMinutes = 6;
        }

        // 구간 이동 시간 (신선육류 보정 계수 1.15 적용)
        if (idx === 0) {
          stop.driveMinutes = 7;
        } else {
          const prev = stops[idx - 1];
          const distKm = computeDistanceKm(prev.lat, prev.lng, stop.lat, stop.lng);
          const baseTime = Math.max(3, Math.round((distKm / 32) * 60)); // 시내 32km/h 기준
          stop.driveMinutes = Math.round(baseTime * 1.15);
        }

        if (stop.completed && stop.completedAt) {
          pivotTime = parseHHMM(stop.completedAt);
          stop.etaArrival = stop.completedAt;
          stop.etaFinish = stop.completedAt;
        } else {
          const arrivalD = new Date(pivotTime.getTime() + stop.driveMinutes * 60000);
          const finishD = new Date(arrivalD.getTime() + stop.unloadMinutes * 60000);

          stop.etaArrival = formatToHHMM(arrivalD);
          stop.etaFinish = formatToHHMM(finishD);
          pivotTime = finishD;
        }
      });

      refreshDashboard();
      saveSession();
    }

    function computeDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function parseHHMM(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }

    function formatToHHMM(d) {
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function refreshDashboard() {
      const totalBoxes = stops.reduce((acc, cur) => acc + cur.quantity, 0);
      const doneBoxes = stops.filter(s => s.completed).reduce((acc, cur) => acc + cur.quantity, 0);
      const remainingStops = stops.filter(s => !s.completed).length;

      document.getElementById('stat-count').innerText = `${doneBoxes} / ${totalBoxes}`;
      document.getElementById('stat-remaining').innerText = `${remainingStops} 곳`;

      const nextTarget = stops.find(s => !s.completed);
      document.getElementById('stat-next-eta').innerText = nextTarget ? nextTarget.etaArrival : "완료";

      const finalStop = stops[stops.length - 1];
      document.getElementById('stat-finish-eta').innerText = finalStop ? finalStop.etaFinish : "--:--";
    }

              <!-- 수기 박스 번호 배지 -->
              <div class="flex flex-col items-center">
                <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">BOX</span>
                <span class="px-2 py-1 rounded-lg flex items-center justify-center text-sm font-black border ${
                  isDone 
                    ? 'bg-emerald-950 border-emerald-800 text-emerald-300' 
                    : 'bg-sky-500 text-slate-950 border-sky-400 shadow-md shadow-sky-500/20'
                }">
                  #${boxBadgeText}
                </span>
              </div>

              <div>
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-black text-slate-400 font-mono">[순번 ${index + 1}]</span>
                  <h3 class="font-bold text-sm text-white flex items-center gap-1">
                    ${stop.name}
                    ${stop.collectPay > 0 ? `<span class="text-[10px] bg-amber-900/80 border border-amber-600 text-amber-300 px-1.5 py-0.2 rounded font-bold">착불 ${stop.collectPay.toLocaleString()}원</span>` : ''}
                  </h3>
                </div>
                <p class="text-[11px] text-slate-400 font-mono">
                  ${stop.goods} · ${stop.quantity}박스 
                  <span class="text-slate-500">(${stop.waybills[0]})</span>
                </p>
              </div>
            </div>

            <!-- 미완료 시 순서 이동 버튼 -->
            ${!isDone ? `
              <div class="flex items-center gap-1">
                <button onclick="changeOrder(${index}, -1)" class="touch-btn bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-xs text-slate-300">▲</button>
                <button onclick="changeOrder(${index}, 1)" class="touch-btn bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-xs text-slate-300">▼</button>
              </div>
            ` : ''}
          </div>

          <!-- 도로명 및 도착 예정 시각 바 -->
          <div class="bg-slate-950 rounded-lg p-2 mb-2 flex justify-between items-center text-[11px] border border-slate-800/80">
            <div class="flex items-center gap-1.5 text-slate-300 truncate">
              <i class="fa-solid fa-location-dot text-sky-400 text-xs"></i>
              <span class="font-semibold text-white">${stop.address}</span>
              <span class="text-slate-400 text-[10px]">${stop.detail}</span>
            </div>
            <div class="text-right whitespace-nowrap pl-2">
              <span class="text-slate-400 text-[10px]">도착:</span>
              <span class="font-bold ${isDone ? 'text-slate-500' : 'text-emerald-400'}">${stop.etaArrival}</span>
            </div>
          </div>

          ${stop.notes ? `<div class="text-[10px] text-amber-300/80 mb-2 font-sans">※ ${stop.notes}</div>` : ''}

          <!-- 3대 퀵버튼 & 하차완료 버튼 -->
          <div class="grid grid-cols-4 gap-1.5">
            <button onclick="copyToClipboard('${boxBadgeText}번 ${stop.name}', '타이틀이 복사되었습니다')" class="touch-btn bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg text-xs font-semibold text-center truncate">
              <i class="fa-regular fa-copy mr-1 text-slate-400"></i>타이틀
            </button>
            <button onclick="copyToClipboard('${stop.address}', '정제 도로명이 복사되었습니다')" class="touch-btn bg-sky-950 hover:bg-sky-900 border border-sky-800 text-sky-300 py-2 rounded-lg text-xs font-bold text-center truncate">
              <i class="fa-solid fa-diamond-turn-right mr-1 text-sky-400"></i>내비복사
            </button>
            <a href="tel:${stop.phone}" class="touch-btn bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded-lg text-xs font-semibold flex items-center justify-center">
              <i class="fa-solid fa-phone text-emerald-400 mr-1"></i>통화
            </a>
            <button onclick="toggleDeliveryDone(${index})" class="touch-btn ${
              isDone 
                ? 'bg-emerald-950 border border-emerald-800 text-emerald-300' 
                : 'bg-emerald-600 hover:bg-emerald-500 text-white font-black shadow-md shadow-emerald-700/20'
            } py-2 rounded-lg text-xs text-center">
              ${isDone ? `<i class="fa-solid fa-check mr-1"></i>${stop.completedAt}` : '하차완료'}
            </button>
          </div>
        `;

        listEl.appendChild(card);
      });
    }

    function toggleDeliveryDone(index) {
      const stop = stops[index];
      if (stop.completed) {
        stop.completed = false;
        stop.completedAt = null;
      } else {
        const d = new Date();
        stop.completed = true;
        stop.completedAt = formatToHHMM(d);
      }
      recalculatePhysics();
      renderCardList();
      renderMapVisuals();
    }

    function changeOrder(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= stops.length) return;
      if (stops[index].completed || stops[target].completed) return;

      const temp = stops[index];
      stops[index] = stops[target];
      stops[target] = temp;

      recalculatePhysics();
      renderCardList();
      renderMapVisuals();
    }

    // 추천 5대 권역 루프순 정렬
    function sortByRecommendedLoop() {
      const loopOrder = [
        "stop_6",      // 1. 고사마루길
        "stop_16",     // 2. 1100로
        "stop_1_9",    // 3. 수목원길 묶음
        "stop_3",      // 4. 한라대학로 107
        "stop_11",     // 5. 참맛나김밥
        "stop_7_10",   // 6. 돌돌왕십리곱창 묶음
        "stop_4",      // 7. 부영 504동
        "stop_5",      // 8. 부영 505동
        "stop_13",     // 9. 국밥생각
        "stop_15",     // 10. 이편한세상시티
        "stop_8",      // 11. 원노형4길
        "stop_17",     // 12. 청담약국
        "stop_18",     // 13. 노형에코하임
        "stop_14",     // 14. 뜨란채
        "stop_2",      // 15. 월랑로4길 광도빌라
        "stop_12"      // 16. 한송주택 다랑곶
      ];

      stops.sort((a, b) => loopOrder.indexOf(a.id) - loopOrder.indexOf(b.id));

      document.getElementById('btn-sort-course').className = "touch-btn px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px] font-bold";
      document.getElementById('btn-sort-box').className = "touch-btn px-2.5 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700 text-[11px]";

      recalculatePhysics();
      renderCardList();
      renderMapVisuals();
    }

    // 박스 번호 기준 정렬 (1번 ~ 18번 오름차순)
    function sortByBoxNoAsc() {
      stops.sort((a, b) => a.boxNumbers[0] - b.boxNumbers[0]);

      document.getElementById('btn-sort-box').className = "touch-btn px-2.5 py-1 rounded bg-sky-500/20 text-sky-300 border border-sky-500/40 text-[11px] font-bold";
      document.getElementById('btn-sort-course').className = "touch-btn px-2.5 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700 text-[11px]";

      recalculatePhysics();
      renderCardList();
      renderMapVisuals();
    }

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => showToast(msg));
    }

    function showToast(msg) {
      const t = document.createElement("div");
      t.className = "fixed bottom-5 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900 border border-sky-400 text-sky-300 text-xs px-4 py-2 rounded-full shadow-2xl transition-opacity";
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => {
        t.style.opacity = "0";
        setTimeout(() => t.remove(), 300);
      }, 1400);
    }

    // ------------------------------------------------------------------
    // Leaflet 지도 관제
    // ------------------------------------------------------------------
    function initLeaflet() {
      leafletMap = L.map('map', { zoomControl: false }).setView([33.4830, 126.4800], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap'
      }).addTo(leafletMap);
    }

    function toggleMapHeight() {
      const mapDiv = document.getElementById('map');
      mapDiv.style.height = mapDiv.style.height === '400px' ? '250px' : '400px';
      setTimeout(() => leafletMap.invalidateSize(), 200);
    }

    function renderMapVisuals() {
      if (!leafletMap) return;

      mapMarkers.forEach(m => leafletMap.removeLayer(m));
      mapMarkers = [];
      if (polylineRoute) leafletMap.removeLayer(polylineRoute);

      const latlngs = [];

      stops.forEach((stop, i) => {
        const coord = [stop.lat, stop.lng];
        latlngs.push(coord);

        const badge = stop.boxNumbers.join('/');
        const pinIcon = L.divIcon({
          className: 'pin',
          html: `<div style="background-color: ${stop.completed ? '#10b981' : '#0284c7'}; color: white; width: 26px; height: 26px; border-radius: 6px; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; box-shadow: 0 2px 5px rgba(0,0,0,0.5);">${stop.completed ? '✓' : badge}</div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13]
        });

        const marker = L.marker(coord, { icon: pinIcon }).addTo(leafletMap);
        marker.bindPopup(`<b>#${badge} (${stop.name})</b><br>${stop.address}<br>도착예정: ${stop.etaArrival}`);
        mapMarkers.push(marker);
      });

      if (latlngs.length > 1) {
        polylineRoute = L.polyline(latlngs, {
          color: '#38bdf8',
          weight: 3.5,
          dashArray: '5, 7',
          opacity: 0.85
        }).addTo(leafletMap);
        leafletMap.fitBounds(polylineRoute.getBounds(), { padding: [30, 30] });
      }
    }

    // ------------------------------------------------------------------
    // 신규 이미지 OCR 업로더
    // ------------------------------------------------------------------
    function bindCameraUploader() {
      const input = document.getElementById('camera-input');
      input.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const pBar = document.getElementById('ocr-progress-bar');
        const pMsg = document.getElementById('ocr-status-msg');
        const pPct = document.getElementById('ocr-pct');
        pBar.classList.remove('hidden');

        for (let i = 0; i < files.length; i++) {
          pMsg.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>[${i + 1}/${files.length}] 신규 송장 OCR 판독 중...`;
          pPct.innerText = `${Math.round(((i + 1) / files.length) * 100)}%`;

          try {
            const worker = await Tesseract.createWorker('kor+eng');
            const res = await worker.recognize(files[i]);
            await worker.terminate();
            
            const raw = res.data.text || "";
            const boxMatch = raw.match(/\b([1-9][0-9]?)\b/);
            const boxVal = boxMatch ? parseInt(boxMatch[1], 10) : (stops.length + 1);

            stops.push({
              id: `stop_new_${Date.now()}_${i}`,
              boxNumbers: [boxVal],
              name: `신규 배송지 (#${boxVal})`,
              waybills: ["신규스캔"],
              address: "제주시 노형로 378",
              detail: "상세 확인 요망",
              goods: "신선식품",
              quantity: 1,
              phone: "010-0000-0000",
              notes: "현장 추가 스캔 등록건",
              lat: 33.4830 + (Math.random() * 0.006 - 0.003),
              lng: 126.4800 + (Math.random() * 0.006 - 0.003),
              collectPay: 0,
              completed: false,
              completedAt: null
            });
          } catch (err) {
            console.error("OCR 실패:", err);
          }
        }

        pBar.classList.add('hidden');
        input.value = "";
        recalculatePhysics();
        renderCardList();
        renderMapVisuals();
      });
    }
  </script>
</body>
</html>
