    // ----------------------------------------------------
    window.addEventListener("DOMContentLoaded", () => {
      initMap();
      startLiveClock();
      loadPersistedData();
    });

    function startLiveClock() {
      const el = document.getElementById('current-clock');
      const update = () => {
        const d = new Date();
        el.innerText = `현재시각: ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
      };
      update();
      setInterval(update, 1000);
    }

    function savePersistedData() {
      localStorage.setItem(`jeju_stops_${SESSION_NAME}`, JSON.stringify(stops));
      localStorage.setItem(`jeju_starttime_${SESSION_NAME}`, departureTime);
      
      const completedMap = {};
      const timestampMap = {};
      stops.forEach(s => {
        if (s.completed) {
          completedMap[s.id] = true;
          timestampMap[s.id] = s.completedAt;
        }
      });
      localStorage.setItem(`jeju_completed_${SESSION_NAME}`, JSON.stringify(completedMap));
      localStorage.setItem(`jeju_timestamps_${SESSION_NAME}`, JSON.stringify(timestampMap));
    }

    function loadPersistedData() {
      const savedStops = localStorage.getItem(`jeju_stops_${SESSION_NAME}`);
      const savedStart = localStorage.getItem(`jeju_starttime_${SESSION_NAME}`);
      const savedCompleted = localStorage.getItem(`jeju_completed_${SESSION_NAME}`);
      const savedTimestamps = localStorage.getItem(`jeju_timestamps_${SESSION_NAME}`);

      if (savedStops) {
        try {
          stops = JSON.parse(savedStops);
          if (savedStart) departureTime = savedStart;

          if (savedCompleted && savedTimestamps) {
            const cMap = JSON.parse(savedCompleted);
            const tMap = JSON.parse(savedTimestamps);
            stops.forEach(s => {
              if (cMap[s.id]) {
                s.completed = true;
                s.completedAt = tMap[s.id];
              }
            });
          }
          triggerDynamicRecalculation();
          return;
        } catch (e) {
          console.error("데이터 복원 오류:", e);
        }
      }
      // 초기 로드
      stops = JSON.parse(JSON.stringify(INITIAL_STOPS));
      triggerDynamicRecalculation();
    }

    function resetCompletedStatus() {
      if (!confirm("모든 하차완료 기록을 초기화하시겠습니까?")) return;
      stops.forEach(s => {
        s.completed = false;
        s.completedAt = null;
      });
      triggerDynamicRecalculation();
    }

    // ----------------------------------------------------
    // 3. 핵심 알고리즘: 동적 도로 매트릭스 & 물리 보정
    // ----------------------------------------------------
    function calculateDynamicRoadTime(fromLat, fromLon, toLat, toLon, address, goods) {
      const R = 6371; // 지구 반경
      const dLat = (toLat - fromLat) * Math.PI / 180;
      const dLon = (toLon - fromLon) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(fromLat * Math.PI / 180) * Math.cos(toLat * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const straightKm = R * c;

      // 제주도 도로 굴곡도 계수 1.32
      const roadKm = Math.max(0.6, straightKm * 1.32);

      // 1톤 탑차 시내 35km/h 기준 기본 주행 분 환산
      let baseMin = Math.round((roadKm / 35.0) * 60);

      // 1톤 만차 도로 환경 계수 (K_road)
      let kRoad = 1.35; // 시내 신호 밀집 기본 1.35배
      if (address.includes("1100로") || address.includes("516로") || address.includes("고사마루길")) {
        kRoad = 1.55; // 중산간 급오르막 등판 부하
      } else if (address.includes("평화로") || address.includes("번영로")) {
        kRoad = 1.15; // 고속화 도로
      }

      // 화물 특성 계수 (K_cargo)
      let kCargo = (goods.includes("과일") || goods.includes("사과") || goods.includes("배")) ? 1.15 : 1.0;

      let driveMin = Math.max(3, Math.round(baseMin * kRoad * kCargo));

      return {
        roadKm: parseFloat(roadKm.toFixed(1)),
        driveMin: driveMin
      };
    }

    function computeUnloadDuration(stop) {
      if (stop.quantity >= 2) return 9; // 합포/대량
      if (stop.building && (stop.building.includes("호") || stop.building.includes("층") || stop.building.includes("아파트"))) {
        return 8; // E/V 경유
      }
      return 5; // 소량 쾌속 인계
    }

    async function triggerDynamicRecalculation() {
      const statusBox = document.getElementById('routing-status');
      statusBox.classList.remove('hidden');

      let accumulatedKm = 0;
      let pivotTime = parseHHMM(departureTime);

      stops.forEach((stop, idx) => {
        stop.unloadMin = computeUnloadDuration(stop);

        // [결정적 버그 수정] 이전 지점 좌표를 동적으로 추적 (1번은 출발 거점 기준)
        let fromLat, fromLon;
        if (idx === 0) {
          fromLat = BASE_DEPOT.lat;
          fromLon = BASE_DEPOT.lng;
        } else {
          fromLat = stops[idx - 1].lat;
          fromLon = stops[idx - 1].lng;
        }

        const metrics = calculateDynamicRoadTime(fromLat, fromLon, stop.lat, stop.lng, stop.address, stop.goods);
        stop.roadKm = metrics.roadKm;
        stop.driveMin = metrics.driveMin;
        accumulatedKm += metrics.roadKm;

        // 실시간 연쇄 시간 갱신 (완료 시각 박제)
        if (stop.completed && stop.completedAt) {
          pivotTime = parseHHMM(stop.completedAt);
          stop.etaArrival = stop.completedAt;
          stop.etaFinish = stop.completedAt;
        } else {
          const arrDate = new Date(pivotTime.getTime() + stop.driveMin * 60000);
          const finDate = new Date(arrDate.getTime() + stop.unloadMin * 60000);

          stop.etaArrival = formatHHMM(arrDate);
          stop.etaFinish = formatHHMM(finDate);
          pivotTime = finDate;
        }
      });

      // 대시보드 갱신
      const totalBoxes = stops.reduce((sum, s) => sum + s.quantity, 0);
      const doneBoxes = stops.filter(s => s.completed).reduce((sum, s) => sum + s.quantity, 0);
      document.getElementById('stat-count').innerText = `${doneBoxes} / ${totalBoxes}`;
      document.getElementById('stat-total-dist').innerText = `${accumulatedKm.toFixed(1)} km`;

      const nextStop = stops.find(s => !s.completed);
      document.getElementById('stat-next-eta').innerText = nextStop ? nextStop.etaArrival : "완판";

      const finalStop = stops[stops.length - 1];
      document.getElementById('stat-finish-eta').innerText = finalStop ? finalStop.etaFinish : "--:--";

      statusBox.classList.add('hidden');
      savePersistedData();
      renderCards();
      renderMapRoute();
    }

    function parseHHMM(str) {
      const [h, m] = str.split(':').map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }

    function formatHHMM(d) {
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // ----------------------------------------------------
    // 4. UI 카드 렌더링 & 버튼 듀오(Duo) 밀착 배치
    // ----------------------------------------------------
    function renderCards() {
      const container = document.getElementById('card-list-container');
      container.innerHTML = "";

      stops.forEach((stop, index) => {
        const isDone = stop.completed;
        const boxBadge = stop.boxNos.join(", ");
        const isFinal = (index === stops.length - 1);
        const isLarge = (stop.quantity >= 2);

        // 타이틀 복사: 층수/동호수 결합 정규식
        const titleCopyText = buildTitleWithBuildingInfo(stop, boxBadge);
        // 내비 복사: 정제 도로명 주소
        const cleanRoadAddr = sanitizeRoadAddress(stop.address);

        // 전화번호 유효성 검사 (오발신 방지)
        const hasValidPhone = stop.phone && stop.phone.replace(/[^0-9]/g, '').length >= 9 && !stop.phone.includes("****");

        const card = document.createElement('div');
        
        // 카드 외곽선 강조 (대량처: 파란색, 완판지: 황금색, 일반: slate)
        let borderClass = "border-slate-800";
        if (isDone) {
          borderClass = "border-emerald-950/80";
        } else if (isFinal) {
          borderClass = "border-amber-400/90 shadow-amber-500/10";
        } else if (isLarge) {
          borderClass = "border-sky-500/80 shadow-sky-500/10";
        }

        card.className = `p-4 rounded-3xl border transition-all ${
          isDone ? 'bg-slate-900/40 text-slate-500' : 'bg-slate-900 text-slate-100 shadow-xl'
        } ${borderClass}`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex items-center gap-2.5">
              <!-- 박스 번호 배지 -->
              <div class="flex flex-col items-center">
                <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">BOX</span>
                <span class="px-2.5 py-1 rounded-2xl flex items-center justify-center text-sm font-black border ${
                  isDone 
                    ? 'bg-emerald-950 border-emerald-800 text-emerald-300' 
                    : 'bg-sky-500 text-slate-950 border-sky-400 shadow-md'
                }">
                  #${boxBadge}
                </span>
              </div>

              <div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-xs font-black text-slate-400 font-mono">[순번 ${index + 1}]</span>
                  <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${
                    stop.sectionTag === '오전' ? 'bg-sky-950 text-sky-300 border border-sky-800' : 'bg-orange-950 text-orange-300 border border-orange-800'
                  }">${stop.sectionTag}</span>
                  <h3 class="font-extrabold text-base text-white">${stop.name}</h3>
                  ${stop.payAmount > 0 ? `<span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/50 px-2 py-0.5 rounded-full font-bold">착불 ${stop.payAmount.toLocaleString()}원</span>` : ''}
                </div>
                <p class="text-xs text-slate-400 font-mono mt-0.5">
                  ${stop.goods} · ${stop.quantity}박스 <span class="text-slate-500">(${stop.roadKm}km/${stop.driveMin}분)</span>
                </p>
              </div>
            </div>

            <!-- 순서 조정 및 1번 지정 버튼 -->
            ${!isDone ? `
              <div class="flex items-center gap-1">
                <button onclick="promoteToFirst(${index})" class="touch-pill px-2 py-1 rounded-full bg-amber-600 hover:bg-amber-500 text-[10px] font-black text-slate-950">1번</button>
                <button onclick="moveStop(${index}, -1)" class="touch-pill w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs">▲</button>
                <button onclick="moveStop(${index}, 1)" class="touch-pill w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs">▼</button>
              </div>
            ` : ''}
          </div>

          <!-- 주소 정보 바 -->
          <div class="bg-slate-950/80 rounded-2xl p-2.5 mb-2 flex justify-between items-center text-xs border border-slate-800/80">
            <div class="flex items-center gap-1.5 text-slate-300 truncate pr-2">
              <i class="fa-solid fa-location-dot text-sky-400 text-xs"></i>
              <span class="font-bold text-white">${stop.address}</span>
              <span class="text-sky-300/90 text-[11px] font-semibold">${stop.building || ''}</span>
            </div>
            <div class="text-right whitespace-nowrap">
              <span class="text-slate-400 text-[10px]">도착:</span>
              <span class="font-black ${isDone ? 'text-slate-500' : 'text-emerald-400'}">${stop.etaArrival}</span>
            </div>
          </div>

          ${stop.notes ? `<div class="text-[11px] text-amber-300/80 mb-2.5 px-1 font-sans">※ ${stop.notes}</div>` : ''}

          <!-- 버튼 듀오(타이틀+내비복사) 밀착 배치 + 통화 + 완료 1열 구성 -->
          <div class="grid grid-cols-4 gap-2">
            <!-- [듀오 1] 타이틀 복사 -->
            <button onclick="copyToClipboard('${titleCopyText}', '타이틀+상세정보 복사완료')" class="touch-pill bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-full text-xs font-bold text-center truncate border border-slate-700/60 shadow-sm">
              <i class="fa-regular fa-copy mr-1 text-slate-400"></i>타이틀
            </button>
            <!-- [듀오 2] 정제 도로명 내비복사 -->
            <button onclick="copyToClipboard('${cleanRoadAddr}', '정제 도로명 복사완료 (카카오/티맵)')" class="touch-pill bg-sky-950 hover:bg-sky-900 border border-sky-800 text-sky-300 py-2.5 rounded-full text-xs font-black text-center truncate shadow-sm">
              <i class="fa-solid fa-diamond-turn-right mr-1 text-sky-400"></i>내비복사
            </button>
            <!-- 통화 버튼 (유효 번호 없을 시 자동 비활성화) -->
            <a href="${hasValidPhone ? 'tel:' + stop.phone : 'javascript:void(0)'}" class="touch-pill py-2.5 rounded-full text-xs font-bold flex items-center justify-center border shadow-sm ${
              hasValidPhone 
                ? 'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700/60' 
                : 'bg-slate-900 text-slate-600 border-slate-800 opacity-40 pointer-events-none'
            }">
              <i class="fa-solid fa-phone ${hasValidPhone ? 'text-emerald-400' : 'text-slate-600'} mr-1"></i>통화
            </a>
            <!-- 하차완료 버튼 -->
            <button onclick="toggleDone(${index})" class="touch-pill ${
              isDone 
                ? 'bg-emerald-950 border border-emerald-800 text-emerald-300' 
                : 'bg-emerald-600 hover:bg-emerald-500 text-white font-black shadow-lg shadow-emerald-700/30'
            } py-2.5 rounded-full text-xs text-center">
              ${isDone ? `<i class="fa-solid fa-check mr-1"></i>${stop.completedAt}` : '하차완료'}
            </button>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // 층수/동호수 추출 결합기
    function buildTitleWithBuildingInfo(stop, boxBadge) {
      let extra = "";
      if (stop.building) {
        extra = stop.building.trim();
      }
      return `${boxBadge}번 ${stop.name} ${extra}`.trim();
    }

    // 도로명 주소 정제 (호수/동/층수 제거)
    function sanitizeRoadAddress(addr) {
      return addr
        .replace(/\[\vert{}\]/g, '')
        .replace(/(\d+동\s*\d+호|\d+호|\d+층)/g, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    // ----------------------------------------------------
    // 5. 인터랙션 및 순서 변경 제어
    // ----------------------------------------------------
    function toggleDone(index) {
      const stop = stops[index];
      if (stop.completed) {
        stop.completed = false;
        stop.completedAt = null;
      } else {
        const d = new Date();
        stop.completed = true;
        stop.completedAt = formatHHMM(d);
      }
      triggerDynamicRecalculation();
    }

    function moveStop(index, delta) {
      const target = index + delta;
      if (target < 0 || target >= stops.length) return;
      if (stops[index].completed || stops[target].completed) return;

      const tmp = stops[index];
      stops[index] = stops[target];
      stops[target] = tmp;

      triggerDynamicRecalculation();
    }

    function promoteToFirst(index) {
      if (index === 0 || stops[index].completed) return;
      const target = stops.splice(index, 1)[0];
      
      const firstUncompleted = stops.findIndex(s => !s.completed);
      if (firstUncompleted === -1) {
        stops.unshift(target);
      } else {
        stops.splice(firstUncompleted, 0, target);
      }

      triggerDynamicRecalculation();
    }

    function sortByRecommendedCourse() {
      const order = ["s_6", "s_16", "s_1_9", "s_3", "s_11", "s_7_10", "s_4", "s_5", "s_13", "s_15", "s_8", "s_17", "s_18", "s_14", "s_2", "s_12"];
      stops.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));

      document.getElementById('btn-sort-course').className = "touch-pill px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[11px] font-bold";
      document.getElementById('btn-sort-box').className = "touch-pill px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 text-[11px] font-medium";

      triggerDynamicRecalculation();
    }

    function sortByBoxAsc() {
      stops.sort((a, b) => a.boxNos[0] - b.boxNos[0]);

      document.getElementById('btn-sort-box').className = "touch-pill px-3 py-1 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/40 text-[11px] font-bold";
      document.getElementById('btn-sort-course').className = "touch-pill px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 text-[11px] font-medium";

      triggerDynamicRecalculation();
    }

    function copyAllTitles() {
      const allText = stops.map((s, idx) => `${idx + 1}. [BOX #${s.boxNos.join(',')}] ${s.name} ${s.building || ''} (${s.address})`).join('\n');
      copyToClipboard(allText, "전체 배송 명단 복사완료");
    }

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => showToast(msg));
    }

    function showToast(msg) {
      const t = document.createElement("div");
      t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-[9999] bg-slate-900/95 border border-sky-400 text-sky-300 text-xs px-5 py-2.5 rounded-full shadow-2xl transition-all";
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => {
        t.style.opacity = "0";
        setTimeout(() => t.remove(), 250);
      }, 1300);
    }

    // ----------------------------------------------------
    // 6. Leaflet 지도 렌더링 (0px 버그 방지)
    // ----------------------------------------------------
    function initMap() {
      leafletMap = L.map('map', { zoomControl: false }).setView([BASE_DEPOT.lat, BASE_DEPOT.lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; OpenStreetMap'
      }).addTo(leafletMap);
    }

    function toggleMapHeight() {
      const el = document.getElementById('map');
      el.style.height = (el.style.height === '420px') ? '250px' : '420px';
      
      // 0px 깨짐 방지 강제 호출
      setTimeout(() => {
        if (leafletMap) {
          leafletMap.invalidateSize(true);
          if (roadPolylineLayer) leafletMap.fitBounds(roadPolylineLayer.getBounds(), { padding: [30, 30] });
        }
      }, 150);
    }

    function renderMapRoute() {
      if (!leafletMap) return;

      markers.forEach(m => leafletMap.removeLayer(m));
      markers = [];
      if (roadPolylineLayer) leafletMap.removeLayer(roadPolylineLayer);

      const latlngs = [[BASE_DEPOT.lat, BASE_DEPOT.lng]];

      // 출발 거점 마커
      const depotIcon = L.divIcon({
        className: 'depot-pin',
        html: `<div style="background-color: #3b82f6; color: white; width: 28px; height: 28px; border-radius: 9999px; border: 2.5px solid white; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.5);"><i class="fa-solid fa-warehouse"></i></div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
      const dMarker = L.marker([BASE_DEPOT.lat, BASE_DEPOT.lng], { icon: depotIcon }).addTo(leafletMap);
      dMarker.bindPopup(`<b>${BASE_DEPOT.name}</b><br>출차 기준: ${departureTime}`);
      markers.push(dMarker);

      // 배송지 마커
      stops.forEach((stop, idx) => {
        const coord = [stop.lat, stop.lng];
        latlngs.push(coord);

        const badgeText = stop.boxNos.join('/');
        let pinColor = stop.completed ? '#10b981' : (stop.payAmount > 0 ? '#f59e0b' : '#0284c7');
        if (!stop.completed && idx === stops.length - 1) pinColor = '#eab308'; // 완판지

        const pinIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${pinColor}; color: white; width: 28px; height: 28px; border-radius: 9999px; border: 2.5px solid white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.4);">${stop.completed ? '✓' : badgeText}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const m = L.marker(coord, { icon: pinIcon }).addTo(leafletMap);
        m.bindPopup(`<b>#${badgeText} ${stop.name}</b><br>${stop.address}<br>도착예정: ${stop.etaArrival}`);
        markers.push(m);
      });

      if (latlngs.length > 1) {
        roadPolylineLayer = L.polyline(latlngs, {
          color: '#38bdf8',
          weight: 4,
          dashArray: '4, 6',
          opacity: 0.85
        }).addTo(leafletMap);
        leafletMap.fitBounds(roadPolylineLayer.getBounds(), { padding: [35, 35] });
      }
    }

    // ----------------------------------------------------
    // 7. 모달 제어 (테트리스 & 출차조정)
    // ----------------------------------------------------
    function openTetrisModal() {
      const listEl = document.getElementById('tetris-order-list');
      listEl.innerHTML = "";

      // 적재는 배송 순서의 역순 (마지막 배송지가 차 안쪽 끝)
      const reverseList = [...stops].reverse();
      reverseList.forEach((s, idx) => {
        const row = document.createElement('div');
        row.className = "p-2 rounded-xl bg-slate-800/80 border border-slate-700/80 flex justify-between items-center";
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-5 h-5 rounded-full bg-slate-700 text-slate-300 text-[10px] flex items-center justify-center font-bold">${idx + 1}</span>
            <span class="font-bold text-white">#${s.boxNos.join(',')} ${s.name}</span>
          </div>
          <span class="text-[10px] px-2 py-0.5 rounded-full ${
            s.sectionTag === '오전' ? 'bg-sky-950 text-sky-300' : 'bg-orange-950 text-orange-300'
          }">${s.sectionTag} (${idx < 3 ? '적재함 깊숙이' : (idx > reverseList.length - 4 ? '문 앞 바로 하차' : '중간 적재')})</span>
        `;
        listEl.appendChild(row);
      });

      document.getElementById('tetris-modal').classList.remove('hidden');
    }

    function closeTetrisModal() {
      document.getElementById('tetris-modal').classList.add('hidden');
    }

    function openTimeAdjustModal() {
      document.getElementById('input-dept-time').value = departureTime;
      document.getElementById('time-modal').classList.remove('hidden');
    }

    function closeTimeAdjustModal() {
      document.getElementById('time-modal').classList.add('hidden');
    }

    function applyNewDeptTime() {
      const val = document.getElementById('input-dept-time').value;
      if (val) {
        departureTime = val;
        closeTimeAdjustModal();
        triggerDynamicRecalculation();
      }
    }
  </script>
</body>
